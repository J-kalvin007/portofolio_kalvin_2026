# La clé `version` a été retirée : elle est obsolète dans Docker Compose v2,
# qui l'ignore et affiche un avertissement.
services:
  portfolio:
    container_name: portfolio_kalvin
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
    # Variables d'exécution lues dans .env.local (facultatif) — notamment
    # EMAIL_HOST_USER et EMAIL_HOST_PASSWORD, sans lesquelles le formulaire de
    # contact répond « service indisponible ». Elles n'étaient transmises au
    # conteneur par aucun moyen (la ligne d'exemple citait RESEND_API_KEY, une
    # clé que le projet n'utilise pas). Les secrets restent hors de l'image :
    # ils sont injectés au démarrage, jamais copiés au build (.dockerignore).
    env_file:
      - path: .env.local
        required: false
